name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: linux
            os: ubuntu-latest
            args: ""
          - name: windows
            platform: windows
            os: windows-latest
            args: ""
          - name: macos
            platform: macos
            os: macos-latest
            args: ""
          - name: android-arm64
            platform: android
            os: ubuntu-latest
            args: arch=arm64
          - name: ios
            platform: ios
            os: macos-latest
            args: arch=arm64
          - name: web
            platform: web
            os: ubuntu-latest
            args: ""
          - name: web-nothreads
            platform: web
            os: ubuntu-latest
            args: threads=no
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      - name: Install Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11

      - name: Install Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709"

      # Pinned godot-cpp commit, so bumping the submodule invalidates the
      # cache key too.
      - name: Get submodule revisions
        id: submodules
        shell: bash
        run: echo "hash=$(git submodule status | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: .scons_cache
          key: scons-ci-${{ matrix.name }}-${{ hashFiles('src/**', 'SConstruct') }}-${{ steps.submodules.outputs.hash }}
          restore-keys: |
            scons-ci-${{ matrix.name }}-

      # Builds the extension and runs the standalone (no godot-cpp) test in
      # tests/ in one pass. template_debug only: this is a compile/test
      # sanity check, not a release build (see release.yml for that).
      - name: Build and test
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: |
          scons platform=${{ matrix.platform }} ${{ matrix.args }} target=template_debug
          scons tests
